<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0B90B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E1A706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <circle cx="50" cy="50" r="48" fill="#1E2329" stroke="#2B3139" stroke-width="2"/>

  <!-- 头部 -->
  <circle cx="50" cy="32" r="18" fill="url(#grad1)"/>

  <!-- 眼睛 -->
  <circle cx="42" cy="30" r="3" fill="#fff"/>
  <circle cx="58" cy="30" r="3" fill="#fff"/>
  <circle cx="42" cy="30" r="1.5" fill="#000"/>
  <circle cx="58" cy="30" r="1.5" fill="#000"/>

  <!-- 嘴巴 -->
  <path d="M 42 38 Q 50 42 58 38" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 天线/信号 -->
  <path d="M 32 14 L 36 10 M 50 8 L 50 2 M 68 14 L 64 10" stroke="#F0B90B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="2" r="1" fill="#F0B90B"/>
  <circle cx="32" cy="14" r="1" fill="#F0B90B"/>
  <circle cx="68" cy="14" r="1" fill="#F0B90B"/>
  <circle cx="36" cy="10" r="1" fill="#F0B90B"/>
  <circle cx="64" cy="10" r="1" fill="#F0B90B"/>

  <!-- 身体 -->
  <rect x="30" y="50" width="40" height="28" rx="4" fill="url(#grad1)"/>

  <!-- 身体细节 -->
  <rect x="35" y="55" width="30" height="18" rx="2" fill="#1E2329" opacity="0.3"/>

  <!-- 左臂 -->
  <rect x="18" y="52" width="10" height="20" rx="3" fill="url(#grad1)"/>

  <!-- 右臂 -->
  <rect x="72" y="52" width="10" height="20" rx="3" fill="url(#grad1)"/>

  <!-- 左手 -->
  <circle cx="16" cy="72" r="5" fill="url(#grad1)"/>
  <circle cx="16" cy="72" r="2" fill="#1E2329"/>

  <!-- 右手 -->
  <circle cx="84" cy="72" r="5" fill="url(#grad1)"/>
  <circle cx="84" cy="72" r="2" fill="#1E2329"/>

  <!-- 腿部连接 -->
  <rect x="37" y="78" width="6" height="12" rx="2" fill="url(#grad1)"/>
  <rect x="57" y="78" width="6" height="12" rx="2" fill="url(#grad1)"/>

  <!-- 左脚 -->
  <ellipse cx="40" cy="92" rx="6" ry="4" fill="url(#grad1)"/>

  <!-- 右脚 -->
  <ellipse cx="60" cy="92" rx="6" ry="4" fill="url(#grad1)"/>

  <!-- 胸部指示灯 -->
  <circle cx="25" cy="55" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ff0000;#00ff00" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="55" r="2" fill="#00ff00">
    <animate attributeName="fill" values="#00ff00;#ff0000;#00ff00" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- 发光效果 -->
  <circle cx="50" cy="32" r="20" fill="none" stroke="#F0B90B" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>